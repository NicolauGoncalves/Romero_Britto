<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro Pop Art - IA Sem Fundo</title>
    
    <!-- Bibliotecas da IA (MediaPipe) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: #222;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }
        
        .viewer-box {
            position: relative;
            width: 100%;
            background: #000;
            border: 4px solid #ff0055;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        .viewer-box:fullscreen { border: none; border-radius: 0; width: 100vw; height: 100vh; }
        .viewer-box:-webkit-full-screen { border: none; border-radius: 0; width: 100vw; height: 100vh; }

        video { display: none; }
        canvas { width: 100%; height: auto; display: block; }

        /* Indicador de Carregamento da IA */
        #loading {
            position: absolute;
            color: #ffdd00;
            font-weight: bold;
            font-size: 18px;
            z-index: 20;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .top-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .action-btn:hover { background: rgba(255, 0, 85, 0.9); }

        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 15px 10px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 10;
        }
        .arrow-btn:hover { background: rgba(255, 0, 85, 0.9); }
        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bottom-controls label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #ddd;
        }
        input[type="range"] {
            width: 90%;
            accent-color: #ff0055;
        }

        .info-bar { margin-bottom: 15px; font-size: 14px; color: #aaa; }
        #imgIndicator { font-weight: bold; color: #ffdd00; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Filtro Pop Art IA 🎨</h2>
        
        <div class="info-bar">
            Fundo atual: <span id="imgIndicator">imagem1.jpg</span>
        </div>

        <div class="viewer-box" id="viewerBox">
            
            <div id="loading">Carregando IA de recorte... aguarde.</div>

            <div class="top-controls">
                <button class="action-btn" onclick="inverterOrdem()" title="Trocar quem fica na frente">🔄 Inverter</button>
                <button class="action-btn" onclick="tirarFoto()" title="Salvar Imagem">📸 Capturar</button>
                <button class="action-btn" onclick="toggleFullscreen()" title="Tela Cheia">⛶</button>
            </div>

            <button class="arrow-btn arrow-left" onclick="mudarImagem(-1)">◀</button>
            <canvas id="canvas"></canvas>
            <button class="arrow-btn arrow-right" onclick="mudarImagem(1)">▶</button>

            <div class="bottom-controls">
                <label for="transparencyRange">Transparência da Camada Superior (<span id="valorTransparencia">90</span>%):</label>
                <input type="range" id="transparencyRange" min="0" max="100" step="1" value="90">
            </div>

        </div>

        <video id="webcam" autoplay playsinline></video>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const transparencyRange = document.getElementById('transparencyRange');
        const valorTransparencia = document.getElementById('valorTransparencia');
        const imgIndicator = document.getElementById('imgIndicator');
        const viewerBox = document.getElementById('viewerBox');
        const loading = document.getElementById('loading');

        // Canvas oculto usado apenas para o recorte da máscara da IA
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');

        let indiceAtual = 1;
        const totalImagens = 10;
        let imagemAtual = new Image();
        let pessoaNaFrente = true; 

        function carregarImagemAtual() {
            const nomeArquivo = `imagem${indiceAtual}.jpg`;
            imgIndicator.innerText = nomeArquivo;
            imagemAtual.src = nomeArquivo;
        }

        function mudarImagem(direcao) {
            indiceAtual += direcao;
            if (indiceAtual > totalImagens) indiceAtual = 1;
            else if (indiceAtual < 1) indiceAtual = totalImagens;
            carregarImagemAtual();
        }

        function inverterOrdem() { pessoaNaFrente = !pessoaNaFrente; }

        function tirarFoto() {
            const link = document.createElement('a');
            link.download = `Arte_Britto_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (viewerBox.requestFullscreen) viewerBox.requestFullscreen();
                else if (viewerBox.webkitRequestFullscreen) viewerBox.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        carregarImagemAtual();

        transparencyRange.addEventListener('input', function() {
            valorTransparencia.innerText = this.value;
        });

        // Configuração da IA de Segmentação (MediaPipe)
        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }});
        selfieSegmentation.setOptions({ modelSelection: 1 }); // Otimizado para computadores/câmeras amplas
        
        selfieSegmentation.onResults(onResults);

        // Inicializa a câmera e envia os quadros para a IA
        const camera = new Camera(video, {
            onFrame: async () => {
                await selfieSegmentation.send({image: video});
            },
            width: 640,
            height: 480
        });
        camera.start();

        // Função que processa o resultado do recorte
        function onResults(results) {
            loading.style.display = 'none'; // Some com o aviso de carregamento

            canvas.width = results.image.width;
            canvas.height = results.image.height;
            offCanvas.width = results.image.width;
            offCanvas.height = results.image.height;

            // 1. Prepara a pessoa sem fundo no canvas oculto
            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            // Desenha a máscara (silhueta)
            offCtx.globalCompositeOperation = 'source-over';
            offCtx.drawImage(results.segmentationMask, 0, 0, offCanvas.width, offCanvas.height);
            // Preenche a silhueta com a imagem real da webcam
            offCtx.globalCompositeOperation = 'source-in';
            offCtx.drawImage(results.image, 0, 0, offCanvas.width, offCanvas.height);

            let transparencia = parseInt(transparencyRange.value) / 100;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (pessoaNaFrente) {
                // Desenha a obra de arte no fundo
                if (imagemAtual.complete && imagemAtual.naturalWidth !== 0) {
                    ctx.drawImage(imagemAtual, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = "#ffdd00";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                
                // Desenha a pessoa sem fundo por cima
                ctx.globalAlpha = transparencia; 
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);

            } else {
                // Desenha a pessoa sem fundo primeiro
                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);
                
                // Desenha a arte por cima
                ctx.globalAlpha = transparencia; 
                if (imagemAtual.complete && imagemAtual.naturalWidth !== 0) {
                    ctx.drawImage(imagemAtual, 0, 0, canvas.width, canvas.height);
                }
            }

            ctx.globalAlpha = 1.0;
        }
    </script>

</body>
</html>
